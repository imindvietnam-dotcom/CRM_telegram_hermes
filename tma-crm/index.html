<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iMind CRM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; line-height: 1.4; padding-bottom: 60px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-group { flex: 1; min-width: 100px; }
        .filter-group label { display: block; font-size: 11px; opacity: 0.9; margin-bottom: 4px; }
        .filter-group select, .filter-group input { width: 100%; padding: 8px 10px; border: none; border-radius: 6px; font-size: 13px; background: rgba(255,255,255,0.95); }
        .stats { display: flex; gap: 12px; padding: 12px 16px; background: white; border-bottom: 1px solid #e0e0e0; overflow-x: auto; }
        .stat-item { text-align: center; min-width: 60px; }
        .stat-value { font-size: 20px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .table-container { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 280px); -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 2800px; }
        thead { position: sticky; top: 0; z-index: 50; }
        thead th { background: #667eea; color: white; padding: 10px 8px; text-align: left; font-weight: 600; white-space: nowrap; border-right: 1px solid rgba(255,255,255,0.2); }
        thead th:last-child { border-right: none; }
        tbody tr { background: white; border-bottom: 1px solid #e0e0e0; transition: background 0.15s; }
        tbody tr:hover { background: #f5f5ff; }
        tbody tr:nth-child(even) { background: #fafafa; }
        tbody tr:nth-child(even):hover { background: #f0f0ff; }
        tr.row-main { background: #e8eaf6 !important; font-weight: 600; border-top: 3px solid #667eea; }
        tr.row-main td { color: #1a1a2e; font-weight: 700; padding: 10px 8px; white-space: nowrap; border-right: 1px solid #c5cae9; }
        tr.row-main td:last-child { border-right: none; }
        tr.row-sub { background: #ffffff !important; }
        tr.row-sub:nth-child(even) { background: #f8f9ff !important; }
        tr.row-sub td { padding: 10px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid #e0e0e0; max-width: 200px; }
        tr.row-sub td:last-child { border-right: none; }
        .stage-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; }
        .stage-Lead { background: #f5f5f5; color: #666; }
        .stage-Bao-gia { background: #fff3e0; color: #e65100; }
        .money { font-family: monospace; text-align: right; color: #2e7d32; }
        .status-paid { color: #2e7d32; font-weight: 600; }
        .status-unpaid { color: #c62222; font-weight: 500; }
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; margin-top: 4px; min-width: 60px; }
        .progress-fill { height: 100%; background: #667eea; border-radius: 3px; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .spinner { width: 30px; height: 30px; border: 3px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px; color: #888; }
        .refresh-btn { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background: #667eea; color: white; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(102,126,234,0.4); z-index: 100; }
        .last-updated { text-align: center; font-size: 11px; color: #888; padding: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 iMind CRM</h1>
        <div class="filters">
            <div class="filter-group"><label>Tìm kiếm</label><input type="text" id="searchInput" placeholder="Tên khách hàng..."></div>

            <div class="filter-group"><label>Đến ngày</label><input type="date" id="toDate"></div>
            <div class="filter-group" style="flex: 2;">

                    <option value="30">30 ngày qua</option>
                    <option value="90">90 ngày qua</option>
                    <option value="thisWeek">Tuần này</option>
                    <option value="thisMonth">Tháng này</option>
                    <option value="lastMonth">Tháng trước</option>
                </select>
            </div>
        </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="table-container" id="tableContainer">
        <div class="loading"><div class="spinner"></div><p>Đang tải dữ liệu...</p></div>
    </div>

            renderTable();
            updateTimestamp();
        }

        function parseDate(dateStr) {
            if (!dateStr || dateStr === '—') return null;
            const parts = dateStr.split('/');
            if (parts.length !== 3) return null;
            const [d, m, y] = parts;
            return new Date(y, m - 1, d);
        }

        function applyQuickRange() {
            const sel = document.getElementById('quickRange');
            const today = new Date();
            let from = new Date();
            let to = new Date();

            switch (sel.value) {
                case '7': from.setDate(today.getDate() - 7); break;
                case '14': from.setDate(today.getDate() - 14); break;
                case '30': from.setDate(today.getDate() - 30); break;
                case '90': from.setDate(today.getDate() - 90); break;
                case 'thisWeek': from.setDate(today.getDate() - today.getDay()); break;
                case 'thisMonth': from = new Date(today.getFullYear(), today.getMonth(), 1); break;
                case 'lastMonth':
                    from = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                    to = new Date(today.getFullYear(), today.getMonth(), 0);
                    break;
                default:
                    sel.value = '';
                    document.getElementById('fromDate').value = '';
                    document.getElementById('toDate').value = '';
                    renderStats();
                    renderTable();
                    return;
            }

            document.getElementById('fromDate').value = from.toISOString().slice(0, 10);
            document.getElementById('toDate').value = to.toISOString().slice(0, 10);
            renderStats();
            renderTable();
        }

        function renderStats() {
            const stats = document.getElementById('stats');
            const filtered = getFiltered();
            const mainRows = filtered.filter(r => r.main);
            const totalCustomers = mainRows.length;
            const totalServices = filtered.filter(r => !r.main).length;

            let html = '<div class="stat-item"><div class="stat-value">' + totalCustomers + '</div><div class="stat-label">Khách hàng</div></div>';
            html += '<div class="stat-item"><div class="stat-value">' + totalServices + '</div><div class="stat-label">Dịch vụ</div></div>';

            const byIndustry = {};
            mainRows.forEach(r => { byIndustry[r.industry] = (byIndustry[r.industry] || 0) + 1; });
            const sortedInd = Object.entries(byIndustry).sort((a, b) => b[1] - a[1]).slice(0, 3);
            for (const [ind, cnt] of sortedInd) {
                html += '<div class="stat-item"><div class="stat-value">' + cnt + '</div><div class="stat-label">' + ind + '</div></div>';
            }

            stats.innerHTML = html;
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            const filtered = getFiltered();

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Không tìm thấy dữ liệu</p></div>';
                return;
            }

            let html = '<table>';
            html += '<thead>';
            html += '<tr>';
            html += '<th colspan="4" style="background:#334155;">KHÁCH HÀNG</th>';
            html += '<th colspan="7" style="background:#7c3aed;">HỢP ĐỒNG</th>';
            html += '<th colspan="1" style="background:#059669;">GĐ</th>';
            html += '<th colspan="3" style="background:#059669;">ĐỢT 1</th>';
            html += '<th colspan="3" style="background:#059669;">ĐỢT 2</th>';
            html += '<th colspan="3" style="background:#059669;">ĐỢT 3</th>';
            html += '<th colspan="10" style="background:#d97706;">ORDER</th>';
            html += '<th colspan="6" style="background:#0891b2;">OP</th>';
            html += '</tr>';
            html += '<tr>';
            html += '<th>ID</th><th>Tên</th><th>Ưu tiên</th><th>Ngành</th>';
            html += '<th>Ngày TN</th><th>Ngày BĐ HĐ</th><th>Ngày KT HĐ</th>';
            html += '<th>Giá trước CK</th><th>Chiết khấu</th><th>Giá sau CK</th><th>Giá tổng sau VAT</th>';
            html += '<th>GĐ</th>';
            html += '<th>Cần TT</th><th>Ngày TT</th><th>Trạng thái</th>';
            html += '<th>Cần TT</th><th>Ngày TT</th><th>Trạng thái</th>';
            html += '<th>Cần TT</th><th>Ngày TT</th><th>Trạng thái</th>';
            html += '<th>ID</th><th>SL 1</th><th>Đơn vị 1</th><th>SL 2</th><th>Đơn vị 2</th>';
            html += '<th>SL 3</th><th>Đơn vị 3</th><th>SL 4</th><th>Đơn vị 4</th><th>Tổng SL</th>';
            html += '<th>Op BĐ</th><th>Op KT</th><th>Tiến độ</th><th>Trung</th><th>Tài</th><th>Ghi chú</th>';
            html += '</tr></thead>';
            html += '<tbody>';

            filtered.forEach(function(r) {
                const rowClass = r.main ? 'row-main' : 'row-sub';
                const stageClass = 'stage-' + r.stage.replace(/\s+/g, '-');

                html += '<tr class="' + rowClass + '">';
                html += '<td>' + r.id + '</td>';
                html += '<td>' + r.name + '</td>';
                html += '<td>' + r.uutien + '</td>';
                html += '<td>' + r.industry + '</td>';
                html += '<td>' + r.ngayTN + '</td>';
                html += '<td>' + r.ngayBD + '</td>';
                html += '<td>' + r.ngayKT + '</td>';
                html += '<td class="money">' + (r.giaTruocCK !== '—' ? formatMoney(r.giaTruocCK) + ' đ' : '—') + '</td>';
                html += '<td>' + r.chietKhau + '</td>';
                html += '<td class="money">' + (r.giaSauCK !== '—' ? formatMoney(r.giaSauCK) + ' đ' : '—') + '</td>';
                html += '<td class="money">' + (r.vat !== '—' ? formatMoney(r.vat) + ' đ' : '—') + '</td>';
                html += '<td><span class="stage-badge ' + stageClass + '">' + r.stage + '</span></td>';
                html += '<td class="money">' + (r.dot1 !== '—' ? formatMoney(r.dot1) + ' đ' : '—') + '</td>';
                html += '<td>' + r.dot1Date + '</td>';
                html += '<td class="' + (r.dot1Status === 'chưa TT' ? 'status-unpaid' : 'status-paid') + '">' + r.dot1Status + '</td>';
                html += '<td class="money">' + (r.dot2 !== '—' ? formatMoney(r.dot2) + ' đ' : '—') + '</td>';
                html += '<td>' + r.dot2Date + '</td>';
                html += '<td class="' + (r.dot2Status === 'chưa TT' ? 'status-unpaid' : 'status-paid') + '">' + r.dot2Status + '</td>';
                html += '<td class="money">' + (r.dot3 !== '—' ? formatMoney(r.dot3) + ' đ' : '—') + '</td>';
                html += '<td>' + r.dot3Date + '</td>';
                html += '<td class="' + (r.dot3Status === 'chưa TT' ? 'status-unpaid' : 'status-paid') + '">' + r.dot3Status + '</td>';
                html += '<td>' + r.id + '</td>';
                html += '<td>' + r.sl1 + '</td><td>' + r.unit1 + '</td>';
                html += '<td>' + r.sl2 + '</td><td>' + r.unit2 + '</td>';
                html += '<td>' + r.sl3 + '</td><td>' + r.unit3 + '</td>';
                html += '<td>' + r.sl4 + '</td><td>' + r.unit4 + '</td>';
                html += '<td>' + r.tongSL + '</td>';
                html += '<td>' + r.opBD + '</td><td>' + r.opKT + '</td>';
                const pct = parseInt(r.tienDo);
                if (!isNaN(pct)) {
                    html += '<td><div>' + r.tienDo + '</div><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></td>';
                } else {
                    html += '<td>' + r.tienDo + '</td>';
                }
                html += '<td>' + r.trung + '</td>';
                html += '<td>' + r.tai + '</td>';
                html += '<td>' + r.note + '</td>';
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function getFiltered() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const fromStr = document.getElementById('fromDate').value;
            const toStr = document.getElementById('toDate').value;

            let fromDate = null;
            let toDate = null;
            if (fromStr) {
                const parts = fromStr.split('-');
                fromDate = new Date(parts[0], parseInt(parts[1]) - 1, parts[2]);
            }
            if (toStr) {
                const parts = toStr.split('-');
                toDate = new Date(parts[0], parseInt(parts[1]) - 1, parts[2]);
                toDate.setHours(23, 59, 59, 999);
            }

            return CRM_DATA.filter(function(r) {
                const matchSearch = !search ||
                    r.name.toLowerCase().includes(search) ||
                    r.id.toLowerCase().includes(search);

                let matchDate = true;
                if (fromDate || toDate) {
                    const dt = parseDate(r.ngayTN);
                    if (dt) {
                        if (fromDate && dt < fromDate) matchDate = false;
                        if (toDate && dt > toDate) matchDate = false;
                    } else {
                        matchDate = false;
                    }
                }

                return matchSearch && matchDate;
            });
        }

        function formatMoney(value) {
            if (!value || value === '—' || value === '') return '—';
            const num = parseInt(value.toString().replace(/[.,]/g, ''));
            if (isNaN(num)) return value;
            return num.toLocaleString('vi-VN');
        }

        function updateTimestamp() {
            document.getElementById('lastUpdated').textContent = 'Cập nhật: ' + new Date().toLocaleTimeString('vi-VN');
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            renderStats();
            renderTable();
        });
        document.getElementById('fromDate').addEventListener('change', function() {
            document.getElementById('quickRange').value = '';
            renderStats();
            renderTable();
        });
        document.getElementById('toDate').addEventListener('change', function() {
            document.getElementById('quickRange').value = '';
            renderStats();
            renderTable();
        });

        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        init();
    </script>
</body>
</html>
