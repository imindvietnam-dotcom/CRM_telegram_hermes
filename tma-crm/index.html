<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iMind CRM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5; color: #333; line-height: 1.4;
            padding-bottom: 60px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 16px; position: sticky; top: 0; z-index: 100;
        }
        .header h1 { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-group { flex: 1; min-width: 100px; }
        .filter-group label { display: block; font-size: 11px; opacity: 0.9; margin-bottom: 4px; }
        .filter-group select, .filter-group input {
            width: 100%; padding: 8px 10px; border: none; border-radius: 6px;
            font-size: 13px; background: rgba(255,255,255,0.95);
        }
        .stats { display: flex; gap: 12px; padding: 12px 16px; background: white; border-bottom: 1px solid #e0e0e0; overflow-x: auto; }
        .stat-item { text-align: center; min-width: 60px; }
        .stat-value { font-size: 20px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        
        /* Section tabs */
        .section-tabs {
            display: flex; gap: 4px; padding: 8px 12px; background: white;
            border-bottom: 1px solid #e0e0e0; overflow-x: auto;
        }
        .section-tab {
            padding: 8px 16px; font-size: 12px; border-radius: 16px;
            background: #f0f0f0; color: #666; white-space: nowrap;
            cursor: pointer; border: none;
        }
        .section-tab.active { background: #667eea; color: white; }
        
        /* Table container */
        .table-container {
            overflow-x: auto;
            overflow-y: auto;
            max-height: calc(100vh - 280px);
            -webkit-overflow-scrolling: touch;
        }
        
        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            table-layout: auto;
        }
        
        /* Sticky header */
        thead {
            position: sticky;
            top: 0;
            z-index: 50;
        }
        thead th {
            background: #667eea;
            color: white;
            padding: 10px 8px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-right: 1px solid rgba(255,255,255,0.2);
        }
        thead th:last-child { border-right: none; }
        
        /* Body rows */
        tbody tr {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.15s;
        }
        tbody tr:hover { background: #f5f5ff; }
        tbody tr:nth-child(even) { background: #fafafa; }
        tbody tr:nth-child(even):hover { background: #f0f0ff; }
        
        /* Main row (customer) */
        tr.row-main {
            background: #e8eaf6 !important;
            font-weight: 600;
            border-top: 2px solid #667eea;
        }
        tr.row-main td {
            color: #1a1a2e;
            font-weight: 700;
        }
        
        /* Sub row (service) */
        tr.row-sub {
            background: #ffffff !important;
        }
        tr.row-sub:nth-child(even) {
            background: #f8f9ff !important;
        }
        tr.row-sub td:first-child {
            padding-left: 24px;
            font-family: monospace;
            color: #555;
        }
        
        tbody td {
            padding: 10px 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-right: 1px solid #e0e0e0;
            max-width: 200px;
        }
        tbody td:last-child { border-right: none; }
        
        /* Stage badges */
        .stage-badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 10px; font-weight: 500;
        }
        .stage-Lead { background: #f5f5f5; color: #666; }
        .stage-Tư\ vấn\/Demo { background: #e3f2fd; color: #1565c0; }
        .stage-Báo\ giá { background: #fff3e0; color: #e65100; }
        .stage-Thanh\ toán\ đợt\ 1 { background: #e8f5e9; color: #2e7d32; }
        .stage-Thanh\ toán\ đợt\ 2 { background: #e0f2f1; color: #00695c; }
        .stage-Thanh\ toán\ đợt\ 3 { background: #e0f7fa; color: #00838f; }
        .stage-Hoàn\ thành { background: #c8e6c9; color: #1b5e20; }
        
        /* Money formatting */
        .money { font-family: monospace; text-align: right; color: #2e7d32; }
        
        /* Progress bar */
        .progress-bar {
            height: 6px; background: #e0e0e0; border-radius: 3px; margin-top: 4px;
            min-width: 60px;
        }
        .progress-fill {
            height: 100%; background: #667eea; border-radius: 3px;
        }
        
        /* Loading & empty */
        .loading { text-align: center; padding: 40px; color: #888; }
        .spinner { width: 30px; height: 30px; border: 3px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }

        .error-msg { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin: 12px; font-size: 12px; }

        .last-updated { text-align: center; font-size: 11px; color: #888; padding: 8px; }
    </style>

        // ============================================
        // CRM TMA LOGIC
        // ============================================
        let customers = [];
        let saleSchedule = [];
        let currentSection = 'hopdong';
        
        // Parse markdown into sections
        function parseCRM(md) {
            const sections = {};
            let currentSection = null;
            let currentTable = [];
            
            const lines = md.split('\n');
            for (const line of lines) {
                const sectionMatch = line.match(/^##\s+\d+\.\s+(.+)/);
                if (sectionMatch) {
                    if (currentSection && currentTable.length > 0) {
                        sections[currentSection] = parseTable(currentTable);
                    }
                    currentSection = sectionMatch[1].trim();
                    currentTable = [];
                    continue;
                }
                
                if (line.trim().startsWith('|') && line.includes('|')) {
                    if (!line.match(/^\|[\s\-:|]+$/)) {
                        currentTable.push(line);
                    }
                }
            }
            if (currentSection && currentTable.length > 0) {
                sections[currentSection] = parseTable(currentTable);
            }
            
            return sections;
        }
        
        // Parse table lines into array of objects
        function parseTable(tableLines) {
            if (tableLines.length < 2) return [];
            
            const parseLine = (line) => {
                line = line.replace(/^\|+\s*/, '').replace(/\s*\|+$/, '');
                return line.split('|').map(c => c.trim());
            };
            
            const headers = parseLine(tableLines[0]);
            const rows = [];
            
            for (let i = 1; i < tableLines.length; i++) {
                const cells = parseLine(tableLines[i]);
                if (cells.length === headers.length) {
                    const row = {};
                    headers.forEach((h, idx) => {
                        row[h] = cells[idx] || '';
                    });
                    rows.push(row);
                }
            }
            
            return rows;
        }
        
        // Build customer objects from sections
        function buildCustomers(sections) {
            const hopDong = sections['HỢP ĐỒNG'] || [];
            const sale = sections['SALE'] || [];
            const order = sections['ORDER'] || [];
            const operation = sections['OPERATION'] || [];
            
            const customers = [];
            
            for (const row of hopDong) {
                const id = row['ID'] || '';
                if (id.includes('-LEAD') || id.includes('-CUST') || id.includes('-AAA') || 
                    id.includes('-15SOCIAL') || id.includes('-VIDAI30') || id.includes('-15SEO') ||
                    id.includes('-Guideline') || id.includes('-MKT-')) {
                    continue;
                }
                
                const customer = {
                    id: id,
                    name: row['Tên doanh nghiệp / khách hàng'] || '',
                    industry: row['Ngành'] || '',
                    services: []
                };
                
                const prefix = id + '-';
                for (const subRow of hopDong) {
                    const subId = subRow['ID'] || '';
                    if (subId.startsWith(prefix)) {
                        const service = {
                            id: subId,
                            name: subRow['Tên doanh nghiệp / khách hàng'] || '',
                            industry: subRow['Ngành'] || '',
                            ngayTiepNhan: subRow['Ngày tiếp nhận khách*'] || '',
                            ngayBD: subRow['Ngày bắt đầu HĐ**'] || '',
                            ngayKT: subRow['Ngày kết thúc HĐ**'] || '',
                            chietKhau: subRow['Chiết khấu**'] || '',
                            giaTruocCK: subRow['Giá trước CK**'] || '',
                            giaSauCK: subRow['Giá sau CK (AI)'] || '',
                            giaVAT: subRow['Giá VAT 8% (AI)'] || ''
                        };
                        
                        const saleRow = sale.find(s => s['ID'] === subId);
                        if (saleRow) {
                            service.saleStage = saleRow['Giai đoạn Sale'] || '';
                            service.saleAmount = saleRow['Số tiền đợt tiếp theo'] || '';
                            service.saleDeadline = saleRow['Thời hạn đợt tiếp theo'] || '';
                            service.saleNote = saleRow['Ghi chú thêm về khách hàng'] || '';
                        }
                        
                        const orderRow = order.find(o => o['ID'] === subId);
                        if (orderRow) {
                            service.order = [
                                { qty: orderRow['Số lượng 1'], unit: orderRow['Đơn vị 1'] },
                                { qty: orderRow['Số lượng 2'], unit: orderRow['Đơn vị 2'] },
                                { qty: orderRow['Số lượng 3'], unit: orderRow['Đơn vị 3'] },
                                { qty: orderRow['Số lượng 4'], unit: orderRow['Đơn vị 4'] }
                            ].filter(o => o.qty && o.qty !== '—' && o.unit && o.unit !== '—');
                        }
                        
                        const opRow = operation.find(o => o['ID'] === subId);
                        if (opRow) {
                            service.opStart = opRow['Ngày bắt đầu'] || '';
                            service.opEnd = opRow['Ngày kết thúc'] || '';
                            service.progress = [
                                { pct: opRow['Tiến độ 1'], unit: opRow['Đơn vị 1'] },
                                { pct: opRow['Tiến độ 2'], unit: opRow['Đơn vị 2'] },
                                { pct: opRow['Tiến độ 3'], unit: opRow['Đơn vị 3'] },
                                { pct: opRow['Tiến độ 4'], unit: opRow['Đơn vị 4'] }
                            ].filter(p => p.pct && p.pct !== '—' && p.unit && p.unit !== '—');
                            service.trung = opRow['Trung'] || '';
                            service.tai = opRow['Tài'] || '';
                        }
                        
                        customer.services.push(service);
                    }
                }
                
                customers.push(customer);
            }
            
            return customers;
        }
        
        function loadData() {
            const container = document.getElementById('tableContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Đang tải dữ liệu...</p></div>';
            
            try {
                const crmSections = parseCRM(CRM_MD);
                const schedSections = parseCRM(SCHEDULE_MD);
                saleSchedule = schedSections['Bảng Thanh Toán Chi Tiết'] || [];
                
                customers = buildCustomers(crmSections);
                
                if (customers.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>Không tìm thấy dữ liệu</p></div>';
                    return;
                }
                
                populateFilters();
                renderStats();
                renderTable();
                updateTimestamp();
            } catch (error) {
                container.innerHTML = `<div class="error-msg">Lỗi: ${error.message}</div>`;
            }
        }
        
        function populateFilters() {
            const stageFilter = document.getElementById('stageFilter');
            const industryFilter = document.getElementById('industryFilter');
            
            const stages = new Set();
            const industries = new Set();
            
            customers.forEach(c => {
                if (c.industry) industries.add(c.industry);
                c.services.forEach(s => {
                    if (s.saleStage) stages.add(s.saleStage);
                });
            });
            
            stageFilter.innerHTML = '<option value="">Tất cả</option>' + 
                [...stages].sort().map(s => `<option value="${s}">${s}</option>`).join('');
            industryFilter.innerHTML = '<option value="">Tất cả</option>' + 
                [...industries].sort().map(i => `<option value="${i}">${i}</option>`).join('');
        }
        
        function renderStats() {
            const stats = document.getElementById('stats');
            const total = customers.length;
            const totalServices = customers.reduce((sum, c) => sum + c.services.length, 0);
            
            const stages = {};
            customers.forEach(c => {
                c.services.forEach(s => {
                    const stage = s.saleStage || 'Unknown';
                    stages[stage] = (stages[stage] || 0) + 1;
                });
            });
            
            let html = `<div class="stat-item"><div class="stat-value">${total}</div><div class="stat-label">Khách hàng</div></div>`;
            html += `<div class="stat-item"><div class="stat-value">${totalServices}</div><div class="stat-label">Dịch vụ</div></div>`;
            
            const sortedStages = Object.entries(stages).sort((a, b) => b[1] - a[1]).slice(0, 3);
            for (const [stage, count] of sortedStages) {
                html += `<div class="stat-item"><div class="stat-value">${count}</div><div class="stat-label">${stage}</div></div>`;
            }
            stats.innerHTML = html;
        }
        
        function showSection(section) {
            currentSection = section;
            document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderTable();
        }
        
        function renderTable() {
            const container = document.getElementById('tableContainer');
            const filtered = getFilteredCustomers();
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Không tìm thấy khách hàng</p></div>';
                return;
            }
            
            let html = '<table>';
            
            // Render based on current section
            if (currentSection === 'hopdong') {
                html += renderHopDongTable(filtered);
            } else if (currentSection === 'sale') {
                html += renderSaleTable(filtered);
            } else if (currentSection === 'order') {
                html += renderOrderTable(filtered);
            } else if (currentSection === 'operation') {
                html += renderOperationTable(filtered);
            }
            
            html += '</table>';
            container.innerHTML = html;
        }
        
        function renderHopDongTable(customers) {
            let html = `
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên doanh nghiệp / khách hàng</th>
                        <th>Ngành</th>
                        <th>Ngày tiếp nhận</th>
                        <th>Ngày BĐ HĐ</th>
                        <th>Ngày KT HĐ</th>
                        <th>Chiết khấu</th>
                        <th>Giá trước CK</th>
                        <th>Giá sau CK</th>
                        <th>VAT 8%</th>
                    </tr>
                </thead>
                <tbody>`;
            
            customers.forEach(c => {
                // Main row
                html += `<tr class="row-main">`;
                html += `<td colspan="10">${c.id} — ${c.name}</td>`;
                html += `</tr>`;
                
                // Sub rows
                c.services.forEach(s => {
                    html += `<tr class="row-sub">`;
                    html += `<td>${s.id}</td>`;
                    html += `<td>${s.name}</td>`;
                    html += `<td>${s.industry}</td>`;
                    html += `<td>${s.ngayTiepNhan}</td>`;
                    html += `<td>${s.ngayBD || '—'}</td>`;
                    html += `<td>${s.ngayKT || '—'}</td>`;
                    html += `<td>${s.chietKhau || '—'}</td>`;
                    html += `<td class="money">${s.giaTruocCK && s.giaTruocCK !== '—' ? formatMoney(s.giaTruocCK) + ' đ' : '—'}</td>`;
                    html += `<td class="money">${s.giaSauCK && s.giaSauCK !== '—' ? formatMoney(s.giaSauCK) + ' đ' : '—'}</td>`;
                    html += `<td class="money">${s.giaVAT && s.giaVAT !== '—' ? formatMoney(s.giaVAT) + ' đ' : '—'}</td>`;
                    html += `</tr>`;
                });
            });
            
            html += '</tbody>';
            return html;
        }
        
        function renderSaleTable(customers) {
            let html = `
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên dịch vụ</th>
                        <th>Giai đoạn</th>
                        <th>Số tiền đợt tiếp</th>
                        <th>Thời hạn</th>
                        <th>Ghi chú</th>
                    </tr>
                </thead>
                <tbody>`;
            
            customers.forEach(c => {
                html += `<tr class="row-main">`;
                html += `<td colspan="6">${c.id} — ${c.name}</td>`;
                html += `</tr>`;
                
                c.services.forEach(s => {
                    const stageClass = s.saleStage ? 'stage-' + s.saleStage.replace(/\s+/g, '\\ ') : '';
                    html += `<tr class="row-sub">`;
                    html += `<td>${s.id}</td>`;
                    html += `<td>${s.name}</td>`;
                    html += `<td>${s.saleStage ? `<span class="stage-badge ${stageClass}">${s.saleStage}</span>` : '—'}</td>`;
                    html += `<td class="money">${s.saleAmount && s.saleAmount !== '—' ? formatMoney(s.saleAmount) + ' đ' : '—'}</td>`;
                    html += `<td>${s.saleDeadline || '—'}</td>`;
                    html += `<td>${s.saleNote || '—'}</td>`;
                    html += `</tr>`;
                });
            });
            
            html += '</tbody>';
            return html;
        }
        
        function renderOrderTable(customers) {
            let html = `
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên dịch vụ</th>
                        <th>Số lượng 1</th>
                        <th>Đơn vị 1</th>
                        <th>Số lượng 2</th>
                        <th>Đơn vị 2</th>
                        <th>Số lượng 3</th>
                        <th>Đơn vị 3</th>
                        <th>Số lượng 4</th>
                        <th>Đơn vị 4</th>
                    </tr>
                </thead>
                <tbody>`;
            
            customers.forEach(c => {
                html += `<tr class="row-main">`;
                html += `<td colspan="10">${c.id} — ${c.name}</td>`;
                html += `</tr>`;
                
                c.services.forEach(s => {
                    const o = s.order || [];
                    html += `<tr class="row-sub">`;
                    html += `<td>${s.id}</td>`;
                    html += `<td>${s.name}</td>`;
                    html += `<td>${o[0]?.qty || '—'}</td>`;
                    html += `<td>${o[0]?.unit || '—'}</td>`;
                    html += `<td>${o[1]?.qty || '—'}</td>`;
                    html += `<td>${o[1]?.unit || '—'}</td>`;
                    html += `<td>${o[2]?.qty || '—'}</td>`;
                    html += `<td>${o[2]?.unit || '—'}</td>`;
                    html += `<td>${o[3]?.qty || '—'}</td>`;
                    html += `<td>${o[3]?.unit || '—'}</td>`;
                    html += `</tr>`;
                });
            });
            
            html += '</tbody>';
            return html;
        }
        
        function renderOperationTable(customers) {
            let html = `
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên dịch vụ</th>
                        <th>Ngày BĐ</th>
                        <th>Ngày KT</th>
                        <th>Tiến độ 1</th>
                        <th>Tiến độ 2</th>
                        <th>Tiến độ 3</th>
                        <th>Tiến độ 4</th>
                        <th>Trung</th>
                        <th>Tài</th>
                    </tr>
                </thead>
                <tbody>`;
            
            customers.forEach(c => {
                html += `<tr class="row-main">`;
                html += `<td colspan="10">${c.id} — ${c.name}</td>`;
                html += `</tr>`;
                
                c.services.forEach(s => {
                    const p = s.progress || [];
                    html += `<tr class="row-sub">`;
                    html += `<td>${s.id}</td>`;
                    html += `<td>${s.name}</td>`;
                    html += `<td>${s.opStart || '—'}</td>`;
                    html += `<td>${s.opEnd || '—'}</td>`;
                    
                    for (let i = 0; i < 4; i++) {
                        if (p[i]) {
                            const pctNum = parseInt(p[i].pct) || 0;
                            html += `<td>
                                <div>${p[i].pct} ${p[i].unit}</div>
                                <div class="progress-bar"><div class="progress-fill" style="width:${pctNum}%"></div></div>
                            </td>`;
                        } else {
                            html += `<td>—</td>`;
                        }
                    }
                    
                    html += `<td>${s.trung || '—'}</td>`;
                    html += `<td>${s.tai || '—'}</td>`;
                    html += `</tr>`;
                });
            });
            
            html += '</tbody>';
            return html;
        }
        
        function getFilteredCustomers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const stage = document.getElementById('stageFilter').value;
            const industry = document.getElementById('industryFilter').value;
            
            return customers.filter(c => {
                const matchSearch = !search || 
                    (c.name && c.name.toLowerCase().includes(search)) || 
                    (c.id && c.id.toLowerCase().includes(search));
                const matchIndustry = !industry || c.industry === industry;
                const matchStage = !stage || c.services.some(s => s.saleStage === stage);
                
                return matchSearch && matchStage && matchIndustry;
            });
        }
        
        function formatMoney(value) {
            if (!value || value === '—' || value === '') return '—';
            const num = parseInt(value.toString().replace(/[.,]/g, ''));
            if (isNaN(num)) return value;
            return num.toLocaleString('vi-VN');
        }
        
        function updateTimestamp() {
            document.getElementById('lastUpdated').textContent = 'Cập nhật: ' + new Date().toLocaleTimeString('vi-VN');
        }
        
        // Event listeners
        document.getElementById('searchInput').addEventListener('input', renderTable);
        document.getElementById('stageFilter').addEventListener('change', renderTable);
        document.getElementById('industryFilter').addEventListener('change', renderTable);
        
        // Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
        
        // Initialize
        loadData();
    </script>
</body>
</html>
